<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Merry Christmas - For Yi</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        html, body {
          margin: 0;
          height: 100%;
          overflow: hidden;
          background: #0d050c;
          font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }

        /* 左上角排版文字 */
        .header-overlay {
          position: fixed;
          top: clamp(28px, 6vh, 56px);
          left: clamp(24px, 6vw, 56px);
          pointer-events: none;
          z-index: 10;
          color: #f7dce8;
        }
        .sub-tag {
          font-size: clamp(10px, 2.4vw, 12px);
          letter-spacing: 0.22em;
          color: rgba(235, 195, 215, 0.65);
          margin-bottom: 8px;
          text-transform: uppercase;
        }
        .main-title {
          font-family: "Georgia", "Times New Roman", "Songti SC", serif;
          font-weight: 400;
          font-size: clamp(32px, 7.5vw, 54px);
          line-height: 1.08;
          margin: 0 0 12px 0;
          background: linear-gradient(180deg, #fff6fa 0%, #f3c6dc 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          text-shadow: 0 4px 24px rgba(255, 130, 190, 0.25);
        }
        .wish-text {
          font-size: clamp(11px, 2.6vw, 13px);
          line-height: 1.7;
          color: rgba(230, 195, 212, 0.72);
          letter-spacing: 0.06em;
        }

        /* 底部交互提示 */
        .footer-hint {
          position: fixed;
          bottom: clamp(18px, 4vh, 32px);
          left: 0;
          right: 0;
          text-align: center;
          font-size: 11px;
          letter-spacing: 0.16em;
          color: rgba(220, 180, 200, 0.42);
          pointer-events: none;
          z-index: 10;
        }

        /* 礼物弹窗 */
        .modal-mask {
          position: fixed;
          inset: 0;
          background: rgba(8, 3, 8, 0.68);
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
          display: flex;
          align-items: center;
          justify-content: center;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.35s ease;
          z-index: 20;
          padding: 24px;
        }
        .modal-mask.show {
          opacity: 1;
          pointer-events: auto;
        }
        .gift-card {
          background: linear-gradient(145deg, rgba(48, 20, 42, 0.95), rgba(24, 10, 22, 0.98));
          border: 1px solid rgba(255, 180, 215, 0.28);
          border-radius: 18px;
          padding: 28px 26px;
          max-width: 320px;
          width: 100%;
          text-align: center;
          color: #fce8f2;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 105, 180, 0.18);
          transform: translateY(16px) scale(0.96);
          transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .modal-mask.show .gift-card {
          transform: translateY(0) scale(1);
        }
        .gift-num {
          font-family: "Georgia", serif;
          font-size: 12px;
          letter-spacing: 0.25em;
          color: #f0a8cc;
          margin-bottom: 10px;
        }
        .gift-title {
          font-size: 18px;
          font-weight: 500;
          margin: 0 0 12px 0;
          color: #fff;
        }
        .gift-desc {
          font-size: 13.5px;
          line-height: 1.75;
          color: rgba(245, 215, 230, 0.85);
          margin: 0 0 22px 0;
        }
        .gift-btn {
          background: linear-gradient(90deg, #d6689b, #b0487a);
          border: none;
          color: #fff;
          padding: 9px 26px;
          border-radius: 20px;
          font-size: 12px;
          letter-spacing: 0.12em;
          cursor: pointer;
          box-shadow: 0 4px 15px rgba(214, 104, 155, 0.35);
        }
    </style>
</head>
<body>

<div class="header-overlay">
    <div class="sub-tag"> &nbsp;·&nbsp; </div>
    <h1 class="main-title">Merry Christmas</h1>
    <div class="wish-text">
        愿鲜花与星光，都落在你的愿望里。<br>
        愿这一份甜，陪你走过整个冬天。
    </div>
</div>

<canvas id="c"></canvas>

<div class="footer-hint"> &nbsp;·&nbsp;  &nbsp;·&nbsp; </div>

<div class="modal-mask" id="modal">
    <div class="gift-card">
        <div class="gift-num" id="m-num">GIFT 01</div>
        <h3 class="gift-title" id="m-title">冬日第一份甜</h3>
        <p class="gift-desc" id="m-desc"></p>
        <button class="gift-btn" id="m-close">收下祝福</button>
    </div>
</div>

<script>
    (function () {
      'use strict';

      var canvas = document.getElementById('c');
      var ctx = canvas.getContext('2d');
      var TAU = Math.PI * 2;
      var W, H, dpr, focal;
      var CAM_D = 33;
      var CAM_Y = -0.6;

      // 交互状态
      var userAngle = 0;
      var autoSpeed = 0.22;
      var isDragging = false;
      var lastX = 0;
      var dragMoved = false;
      var starBurst = 0;
      var starScreenPos = { x: 0, y: 0, r: 40 };
      var giftHitBoxes = [];

      // 场景集合
      var needles = [];
      var lightStrings = [];
      var ornaments = [];
      var snowFlakes = [];
      var dustParticles = [];
      var bokehSpots = [];

      // 新增：烟花与特效粒子集合
      var fireworkRockets = [];
      var fireworkParticles = [];
      var magicSpirits = [];
      var trailParticles = [];
      var nextAutoFirework = 1.5;

      // 预渲染贴图
      var glowSprites = [];
      var ornamentSprites = {};

      var FIREWORK_PALETTES = [
        ['255, 235, 245', '255, 145, 200', '235, 95, 165'],  // 樱花粉
        ['255, 248, 225', '255, 210, 130', '240, 165, 95'],   // 香槟金
        ['248, 235, 255', '210, 160, 255', '175, 115, 235']   // 梦幻紫
      ];
  //文字更改
      var GIFT_DATA = [
        { id: '01', title: '星光与浪漫', desc: '愿你眼底常有星辰闪烁，所遇皆温柔，所求皆如愿。', boxColor: '#7a223d', lidColor: '#962c4d', ribbon: '#e3c5a8', angle: -1.15, dist: 8.6 },
        { id: '02', title: '暖冬小确幸', desc: '天冷的时候有热茶与拥抱，平凡的日子里永远藏着小惊喜。', boxColor: '#b89f8d', lidColor: '#cfb6a4', ribbon: '#f5e6d8', angle: 0.72, dist: 8.4 },
        { id: '03', title: '一整年的甜', desc: '把所有的烦恼都留在今年，明年的每一天都像糖果一样甜。', boxColor: '#9e6b43', lidColor: '#b88054', ribbon: '#ebd0b0', angle: 0.08, dist: 9.2 },
        { id: '04', title: '永不落幕的梦', desc: '愿你永远保持热爱与天真，做自己世界里最耀眼的小公主。', boxColor: '#691932', lidColor: '#822240', ribbon: '#d9bca3', angle: -0.58, dist: 8.5 }
      ];

      function rand(max, min) {
        if (min === undefined) min = 0;
        return min + Math.random() * (max - min);
      }

      function makeGlowSprite(rgb) {
        var s = 64, cv = document.createElement('canvas');
        cv.width = cv.height = s;
        var g = cv.getContext('2d');
        var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.18, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.95)');
        grad.addColorStop(0.45, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.28)');
        grad.addColorStop(1, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, s, s);
        return cv;
      }

      function buildOrnamentSprites() {
        function createBear(furColor, earInner, blushColor) {
          var s = 96, cv = document.createElement('canvas');
          cv.width = cv.height = s;
          var g = cv.getContext('2d');
          var cx = s / 2, cy = s / 2 + 4;

          g.shadowColor = 'rgba(0,0,0,0.45)';
          g.shadowBlur = 10;
          g.shadowOffsetY = 4;

          g.fillStyle = furColor;
          g.beginPath(); g.arc(cx - 21, cy - 20, 11, 0, TAU); g.fill();
          g.beginPath(); g.arc(cx + 21, cy - 20, 11, 0, TAU); g.fill();

          g.shadowBlur = 0; g.shadowOffsetY = 0;
          g.fillStyle = earInner;
          g.beginPath(); g.arc(cx - 21, cy - 20, 6, 0, TAU); g.fill();
          g.beginPath(); g.arc(cx + 21, cy - 20, 6, 0, TAU); g.fill();

          var grad = g.createRadialGradient(cx - 8, cy - 10, 4, cx, cy, 30);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.35, furColor);
          grad.addColorStop(1, earInner);
          g.fillStyle = grad;
          g.beginPath();
          g.ellipse(cx, cy, 27, 23, 0, 0, TAU);
          g.fill();

          g.fillStyle = blushColor;
          g.beginPath(); g.ellipse(cx - 15, cy + 4, 5, 3, 0, 0, TAU); g.fill();
          g.beginPath(); g.ellipse(cx + 15, cy + 4, 5, 3, 0, 0, TAU); g.fill();

          g.fillStyle = '#2b1820';
          g.beginPath(); g.arc(cx - 9, cy - 2, 2.6, 0, TAU); g.fill();
          g.beginPath(); g.arc(cx + 9, cy - 2, 2.6, 0, TAU); g.fill();

          g.fillStyle = '#fff';
          g.beginPath(); g.arc(cx - 9.8, cy - 3, 0.9, 0, TAU); g.fill();
          g.beginPath(); g.arc(cx + 8.2, cy - 3, 0.9, 0, TAU); g.fill();

          g.fillStyle = '#3d222c';
          g.beginPath(); g.ellipse(cx, cy + 3, 3.2, 2.2, 0, 0, TAU); g.fill();
          g.strokeStyle = '#3d222c';
          g.lineWidth = 1.6;
          g.lineCap = 'round';
          g.beginPath();
          g.arc(cx - 2.5, cy + 5.5, 2.5, 0.1 * Math.PI, 0.9 * Math.PI);
          g.stroke();
          g.beginPath();
          g.arc(cx + 2.5, cy + 5.5, 2.5, 0.1 * Math.PI, 0.9 * Math.PI);
          g.stroke();

          return cv;
        }

        function createGoldBall() {
          var s = 84, cv = document.createElement('canvas');
          cv.width = cv.height = s;
          var g = cv.getContext('2d');
          var cx = s / 2, cy = s / 2;

          g.shadowColor = 'rgba(255, 200, 90, 0.5)';
          g.shadowBlur = 12;

          var grad = g.createRadialGradient(cx - 8, cy - 8, 2, cx, cy, 24);
          grad.addColorStop(0, '#fffbe6');
          grad.addColorStop(0.4, '#f7cf68');
          grad.addColorStop(0.85, '#c98d28');
          grad.addColorStop(1, '#8c5a10');
          g.fillStyle = grad;
          g.beginPath();
          g.arc(cx, cy, 22, 0, TAU);
          g.fill();

          g.shadowBlur = 0;
          g.fillStyle = '#5c3808';
          g.beginPath(); g.arc(cx - 6, cy - 2, 2, 0, TAU); g.fill();
          g.beginPath(); g.arc(cx + 6, cy - 2, 2, 0, TAU); g.fill();

          g.strokeStyle = '#5c3808';
          g.lineWidth = 1.8;
          g.lineCap = 'round';
          g.beginPath();
          g.arc(cx, cy + 2, 5.5, 0.15 * Math.PI, 0.85 * Math.PI);
          g.stroke();

          return cv;
        }

        ornamentSprites.whiteBear = createBear('#fff5f8', '#e6c5d2', 'rgba(255, 130, 165, 0.45)');
        ornamentSprites.brownBear = createBear('#c98e63', '#8c5832', 'rgba(255, 110, 140, 0.4)');
        ornamentSprites.goldBall = createGoldBall();
      }

      function buildScene() {
        needles = [];
        lightStrings = [];
        ornaments = [];

        // 1. 松针树冠
        var layers = 26;
        for (var l = 0; l < layers; l++) {
          var t = l / (layers - 1);
          var baseY = -8.4 + t * 14.8;
          var maxR = 6.7 * Math.pow(1 - t, 0.82) + 0.25;
          var branchCount = Math.floor(28 * (1 - t * 0.65)) + 8;

          for (var b = 0; b < branchCount; b++) {
            var bAng = (b / branchCount) * TAU + l * 0.45 + rand(0.18, -0.18);
            var subNeedles = Math.floor(14 * (1 - t * 0.5)) + 5;
            for (var n = 0; n < subNeedles; n++) {
              var rt = n / subNeedles;
              var r = maxR * (0.18 + 0.82 * rt);
              var droop = -rt * rt * 0.55 + rand(0.15, -0.15);
              var spread = rand(0.28, -0.28);
              var ang = bAng + spread;
              needles.push({
                x: Math.cos(ang) * r,
                y: baseY + droop,
                z: Math.sin(ang) * r,
                dx: Math.cos(ang + rand(0.5, -0.5)) * rand(0.55, 0.25),
                dy: rand(-0.1, -0.45),
                dz: Math.sin(ang + rand(0.5, -0.5)) * rand(0.55, 0.25),
                hue: rand(345, 325),
                light: rand(42, 22) + t * 14,
                alpha: rand(0.65, 0.32)
              });
            }
          }
        }

        // 2. 螺旋灯带
        var totalLights = 1600;
        var strands = 2;
        var turns = 7.5;
        for (var i = 0; i < totalLights; i++) {
          var st = i % strands;
          var t = Math.floor(i / strands) / (totalLights / strands);
          var radius = (6.8 * Math.pow(1 - t, 0.82) + 0.35) * 1.03;
          var ang = t * turns * TAU + st * Math.PI + rand(0.08, -0.08);
          lightStrings.push({
            x: Math.cos(ang) * radius,
            y: -8.3 + t * 14.7 + rand(0.12, -0.12),
            z: Math.sin(ang) * radius,
            t: t,
            c: Math.floor(Math.random() * 3),
            size: rand(0.42, 0.18),
            phase: rand(TAU)
          });
        }

        // 3. 树上挂件
        var types = ['whiteBear', 'brownBear', 'goldBall', 'whiteBear', 'brownBear'];
        var ornCount = 46;
        var goldenAngle = Math.PI * (3 - Math.sqrt(5));
        for (var k = 0; k < ornCount; k++) {
          var t = 0.08 + (k / ornCount) * 0.84;
          var radius = (6.75 * Math.pow(1 - t, 0.82) + 0.35) * 1.04;
          var ang = k * goldenAngle + rand(0.15, -0.15);
          var type = types[k % types.length];
          ornaments.push({
            x: Math.cos(ang) * radius,
            y: -8.3 + t * 14.7,
            z: Math.sin(ang) * radius,
            type: type,
            scale: type === 'goldBall' ? rand(0.95, 0.78) : rand(1.15, 0.92),
            swayPhase: rand(TAU)
          });
        }

        // 4. 环绕上升精灵流光粒子
        magicSpirits = [];
        for (var sp = 0; sp < 28; sp++) {
          magicSpirits.push({
            t: Math.random(),
            speed: rand(0.14, 0.07),
            angleOffset: rand(TAU),
            turns: rand(4.5, 2.8),
            size: rand(0.55, 0.28),
            colorIdx: sp % 3,
            history: []
          });
        }

        // 5. 六角雪花
        snowFlakes = [];
        for (var s = 0; s < 36; s++) {
          snowFlakes.push({
            x: rand(W),
            y: rand(H),
            r: rand(11, 4.5),
            speed: rand(0.55, 0.2),
            drift: rand(TAU),
            rot: rand(TAU),
            rotSpd: rand(0.015, -0.015),
            alpha: rand(0.45, 0.15)
          });
        }

        // 6. 细碎星尘与背景光斑
        dustParticles = [];
        for (var d = 0; d < 140; d++) {
          dustParticles.push({
            x: rand(W),
            y: rand(H),
            size: Math.random() < 0.25 ? rand(3.5, 2.2) : rand(2, 1),
            alpha: rand(0.75, 0.18),
            twinkle: rand(TAU),
            spd: rand(0.25, 0.05)
          });
        }

        bokehSpots = [];
        for (var bk = 0; bk < 18; bk++) {
          bokehSpots.push({
            x: rand(W),
            y: rand(H * 0.75),
            r: rand(45, 14),
            alpha: rand(0.12, 0.03)
          });
        }
      }

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        focal = Math.max(680, H * 1.18);
        buildScene();
      }

      function project(x, y, z, angle) {
        var ca = Math.cos(angle), sa = Math.sin(angle);
        var xr = x * ca - z * sa;
        var zr = x * sa + z * ca;
        var scale = focal / (CAM_D - zr);
        return {
          x: W / 2 + xr * scale,
          y: H * 0.51 - (y - CAM_Y) * scale,
          scale: scale,
          z: zr
        };
      }

      // ================= 烟花与粒子系统 =================

      // 发射升空烟花火箭
      function launchFirework(targetX, targetY, scale) {
        if (targetX === undefined) targetX = rand(W * 0.85, W * 0.15);
        if (targetY === undefined) targetY = rand(H * 0.36, H * 0.12);
        if (scale === undefined) scale = rand(1.1, 0.75);

        var startX = targetX + rand(50, -50);
        var startY = H * 0.85;
        fireworkRockets.push({
          x: startX,
          y: startY,
          tx: targetX,
          ty: targetY,
          speed: rand(680, 520),
          scale: scale,
          palette: FIREWORK_PALETTES[Math.floor(Math.random() * FIREWORK_PALETTES.length)],
          trail: []
        });
      }

      // 在指定屏幕坐标直接绽放烟花
      function explodeFirework(x, y, palette, scale) {
        var count = Math.floor(68 * scale);
        // 中心闪光
        fireworkParticles.push({
          x: x, y: y, vx: 0, vy: 0,
          alpha: 1, decay: 3.5,
          size: 42 * scale,
          color: '255, 245, 250',
          isFlash: true
        });

        for (var i = 0; i < count; i++) {
          var ang = (i / count) * TAU + rand(0.08, -0.08);
          // 层次速度，形成内外双环烟花
          var speedBase = (i % 3 === 0 ? rand(170, 130) : rand(260, 180)) * scale;
          var col = palette[i % palette.length];
          fireworkParticles.push({
            x: x,
            y: y,
            vx: Math.cos(ang) * speedBase,
            vy: Math.sin(ang) * speedBase,
            alpha: 1,
            decay: rand(1.15, 0.72),
            size: rand(3.2, 1.6) * scale,
            color: col,
            twinkle: rand(TAU),
            history: []
          });
        }
      }

      // 礼盒打开时的爱心/星屑迸发粒子
      function spawnBurstParticles(x, y, count) {
        for (var i = 0; i < count; i++) {
          var ang = rand(TAU);
          var spd = rand(210, 60);
          trailParticles.push({
            x: x,
            y: y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 60,
            alpha: 1,
            decay: rand(1.4, 0.8),
            size: rand(4.5, 2),
            color: i % 2 === 0 ? '255, 195, 225' : '255, 235, 175',
            gravity: 160
          });
        }
      }

      // 指尖滑动星尘粒子
      function spawnPointerTrail(x, y) {
        for (var i = 0; i < 2; i++) {
          trailParticles.push({
            x: x + rand(6, -6),
            y: y + rand(6, -6),
            vx: rand(28, -28),
            vy: rand(28, -28),
            alpha: 0.9,
            decay: rand(2.2, 1.4),
            size: rand(3.2, 1.4),
            color: Math.random() < 0.6 ? '255, 185, 220' : '255, 240, 195',
            gravity: 25
          });
        }
      }

      function updateAndDrawFireworks(time, dt) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        // 自动低频背景烟花
        nextAutoFirework -= dt;
        if (nextAutoFirework <= 0) {
          // 避开树身正中偏下区域，在夜空两侧与上方绽放
          var fx = Math.random() < 0.5 ? rand(W * 0.34, W * 0.12) : rand(W * 0.88, W * 0.66);
          var fy = rand(H * 0.35, H * 0.14);
          launchFirework(fx, fy, rand(0.95, 0.68));
          nextAutoFirework = rand(4.2, 2.2);
        }

        // 1. 更新并绘制升空火箭
        for (var i = fireworkRockets.length - 1; i >= 0; i--) {
          var r = fireworkRockets[i];
          var dx = r.tx - r.x;
          var dy = r.ty - r.y;
          var dist = Math.hypot(dx, dy);

          r.trail.push({ x: r.x, y: r.y });
          if (r.trail.length > 8) r.trail.shift();

          if (dist < r.speed * dt + 8) {
            explodeFirework(r.tx, r.ty, r.palette, r.scale);
            fireworkRockets.splice(i, 1);
            continue;
          }

          r.x += (dx / dist) * r.speed * dt;
          r.y += (dy / dist) * r.speed * dt;

          // 绘制火箭尾迹
          for (var t = 0; t < r.trail.length; t++) {
            var tp = r.trail[t];
            var ratio = (t + 1) / r.trail.length;
            ctx.fillStyle = 'rgba(255, 225, 240,' + (ratio * 0.55) + ')';
            ctx.beginPath();
            ctx.arc(tp.x, tp.y, ratio * 2.2, 0, TAU);
            ctx.fill();
          }
        }

        // 2. 更新并绘制烟花绽放粒子
        for (var j = fireworkParticles.length - 1; j >= 0; j--) {
          var p = fireworkParticles[j];
          p.alpha -= p.decay * dt;
          if (p.alpha <= 0) {
            fireworkParticles.splice(j, 1);
            continue;
          }

          if (p.isFlash) {
            var fg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
            fg.addColorStop(0, 'rgba(' + p.color + ',' + (p.alpha * 0.85) + ')');
            fg.addColorStop(1, 'rgba(' + p.color + ', 0)');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, TAU);
            ctx.fill();
            continue;
          }

          p.history.push({ x: p.x, y: p.y });
          if (p.history.length > 5) p.history.shift();

          // 空气阻力 + 重力下垂
          p.vx *= Math.pow(0.16, dt);
          p.vy *= Math.pow(0.16, dt);
          p.vy += 68 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;

          var flick = p.alpha < 0.45 ? (0.4 + 0.6 * Math.sin(time * 28 + p.twinkle)) : 1;
          var curAlpha = Math.max(0, p.alpha * flick);

          // 绘制拖尾线段
          if (p.history.length > 1) {
            ctx.strokeStyle = 'rgba(' + p.color + ',' + (curAlpha * 0.55) + ')';
            ctx.lineWidth = p.size * 0.85;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(p.history[0].x, p.history[0].y);
            for (var h = 1; h < p.history.length; h++) {
              ctx.lineTo(p.history[h].x, p.history[h].y);
            }
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
          }

          // 粒子亮芯
          ctx.fillStyle = 'rgba(255, 255, 255,' + curAlpha + ')';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 0.55, 0, TAU);
          ctx.fill();
        }

        // 3. 更新并绘制交互星尘/礼盒粒子
        for (var k = trailParticles.length - 1; k >= 0; k--) {
          var tp = trailParticles[k];
          tp.alpha -= tp.decay * dt;
          if (tp.alpha <= 0) {
            trailParticles.splice(k, 1);
            continue;
          }
          tp.vy += tp.gravity * dt;
          tp.x += tp.vx * dt;
          tp.y += tp.vy * dt;

          ctx.fillStyle = 'rgba(' + tp.color + ',' + tp.alpha + ')';
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, tp.size, 0, TAU);
          ctx.fill();
        }

        ctx.restore();
      }

      // 绘制树身螺旋上升的精灵流光粒子
      function drawMagicSpirits(dt, angle) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (var i = 0; i < magicSpirits.length; i++) {
          var sp = magicSpirits[i];
          sp.t += sp.speed * dt;
          if (sp.t > 1) {
            sp.t -= 1;
            sp.history = [];
          }
          var r = (6.9 * Math.pow(1 - sp.t, 0.82) + 0.35) * 1.07;
          var a = sp.angleOffset + sp.t * sp.turns * TAU;
          var y = -8.4 + sp.t * 15.2;
          var p = project(Math.cos(a) * r, y, Math.sin(a) * r, angle);

          sp.history.push({ x: p.x, y: p.y });
          if (sp.history.length > 7) sp.history.shift();

          var edgeFade = Math.sin(sp.t * Math.PI);
          if (sp.history.length > 1) {
            for (var h = 1; h < sp.history.length; h++) {
              var ratio = h / sp.history.length;
              ctx.strokeStyle = 'rgba(255, 210, 235,' + (ratio * 0.35 * edgeFade) + ')';
              ctx.lineWidth = sp.size * p.scale * 0.14 * ratio;
              ctx.beginPath();
              ctx.moveTo(sp.history[h - 1].x, sp.history[h - 1].y);
              ctx.lineTo(sp.history[h].x, sp.history[h].y);
              ctx.stroke();
            }
          }

          var sz = sp.size * p.scale * 0.9;
          ctx.globalAlpha = 0.85 * edgeFade;
          ctx.drawImage(glowSprites[sp.colorIdx], p.x - sz / 2, p.y - sz / 2, sz, sz);
        }
        ctx.restore();
      }

      // 绘制背景与散景光斑
      function drawBackground(time, dt) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        var g = ctx.createRadialGradient(W * 0.5, H * 0.44, 0, W * 0.5, H * 0.48, Math.max(W, H) * 0.8);
        g.addColorStop(0, '#2c1127');
        g.addColorStop(0.45, '#170816');
        g.addColorStop(1, '#090309');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        ctx.globalCompositeOperation = 'lighter';
        for (var i = 0; i < bokehSpots.length; i++) {
          var b = bokehSpots[i];
          var bg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
          bg.addColorStop(0, 'rgba(255, 190, 225,' + b.alpha + ')');
          bg.addColorStop(1, 'rgba(255, 190, 225, 0)');
          ctx.fillStyle = bg;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, TAU);
          ctx.fill();
        }

        for (var j = 0; j < dustParticles.length; j++) {
          var p = dustParticles[j];
          p.y -= p.spd * dt * 30;
          if (p.y < -10) { p.y = H + 10; p.x = rand(W); }
          var a = p.alpha * (0.6 + 0.4 * Math.sin(time * 2.2 + p.twinkle));
          ctx.fillStyle = 'rgba(255, 235, 245,' + a + ')';
          ctx.fillRect(p.x, p.y, p.size, p.size);
        }
      }

      function drawGroundGlow() {
        var p = project(0, -9.2, 0, 0);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.translate(W / 2, p.y);
        ctx.scale(1, 0.22);
        var R = focal * 0.42;
        var g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
        g.addColorStop(0, 'rgba(235, 130, 185, 0.26)');
        g.addColorStop(0.5, 'rgba(180, 70, 130, 0.1)');
        g.addColorStop(1, 'rgba(120, 30, 80, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, R, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawTreeAndOrnaments(time, angle) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineCap = 'round';
        for (var i = 0; i < needles.length; i++) {
          var n = needles[i];
          var p1 = project(n.x, n.y, n.z, angle);
          var p2 = project(n.x + n.dx, n.y + n.dy, n.z + n.dz, angle);
          var depthFactor = Math.max(0.25, Math.min(1, (p1.z + 7) / 14));
          var light = n.light * (0.65 + 0.45 * depthFactor);
          ctx.strokeStyle = 'hsla(' + n.hue + ', 58%, ' + light + '%, ' + (n.alpha * depthFactor) + ')';
          ctx.lineWidth = Math.max(1.1, p1.scale * 0.065);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }

        ctx.globalCompositeOperation = 'lighter';
        for (var j = 0; j < lightStrings.length; j++) {
          var ls = lightStrings[j];
          var p = project(ls.x, ls.y, ls.z, angle);
          var depth = Math.max(0.2, Math.min(1, (p.z + 7.5) / 14));
          var twinkle = 0.65 + 0.35 * Math.sin(time * 3.2 + ls.phase);
          var wave = Math.pow(0.5 + 0.5 * Math.sin(time * 2.5 - ls.t * 18), 2);
          var sz = ls.size * p.scale * (0.9 + 0.35 * twinkle + 0.25 * wave);
          ctx.globalAlpha = Math.min(1, (0.35 + 0.45 * twinkle + 0.3 * wave) * depth);
          ctx.drawImage(glowSprites[ls.c], p.x - sz / 2, p.y - sz / 2, sz, sz);
        }

        var projectedOrns = [];
        for (var k = 0; k < ornaments.length; k++) {
          var o = ornaments[k];
          var po = project(o.x, o.y, o.z, angle);
          projectedOrns.push({ x: po.x, y: po.y, z: po.z, scale: po.scale, item: o });
        }
        projectedOrns.sort(function (a, b) { return a.z - b.z; });

        ctx.globalCompositeOperation = 'source-over';
        for (var m = 0; m < projectedOrns.length; m++) {
          var po = projectedOrns[m];
          var item = po.item;
          var sprite = ornamentSprites[item.type];
          var depthAlpha = po.z < -1.5 ? 0.55 : 1;
          var drawSize = po.scale * 1.15 * item.scale;
          var sway = Math.sin(time * 2.2 + item.swayPhase) * 0.06;

          ctx.save();
          ctx.globalAlpha = depthAlpha;
          ctx.translate(po.x, po.y);
          ctx.rotate(sway);
          ctx.drawImage(sprite, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
          ctx.restore();
        }
      }

      function drawTopStar(time, angle) {
        var p = project(0, 7.15, 0, angle);
        starScreenPos.x = p.x;
        starScreenPos.y = p.y;
        starScreenPos.r = Math.max(38, focal * 0.058);

        var pulse = 1 + 0.1 * Math.sin(time * 2.8) + starBurst * 0.55;
        ctx.save();
        ctx.translate(p.x, p.y);

        ctx.globalCompositeOperation = 'lighter';
        var glowR = focal * (0.14 + starBurst * 0.14);
        var g = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
        g.addColorStop(0, 'rgba(255, 240, 248, 0.95)');
        g.addColorStop(0.28, 'rgba(255, 175, 215, 0.45)');
        g.addColorStop(1, 'rgba(255, 110, 180, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, glowR, 0, TAU);
        ctx.fill();

        ctx.scale(pulse, pulse);
        ctx.globalCompositeOperation = 'source-over';
        var outerR = focal * 0.044;
        var innerR = outerR * 0.44;
        ctx.beginPath();
        for (var i = 0; i < 10; i++) {
          var r = i % 2 === 0 ? outerR : innerR;
          var a = i * Math.PI / 5 - Math.PI / 2;
          var sx = Math.cos(a) * r;
          var sy = Math.sin(a) * r;
          if (i === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        ctx.closePath();

        var starGrad = ctx.createLinearGradient(-outerR, -outerR, outerR, outerR);
        starGrad.addColorStop(0, '#ffffff');
        starGrad.addColorStop(0.5, '#ffd6ea');
        starGrad.addColorStop(1, '#e895be');
        ctx.fillStyle = starGrad;
        ctx.shadowColor = 'rgba(255, 170, 215, 0.9)';
        ctx.shadowBlur = 24;
        ctx.fill();
        ctx.restore();
      }

      function drawGifts(angle) {
        giftHitBoxes = [];
        var projectedGifts = [];

        for (var i = 0; i < GIFT_DATA.length; i++) {
          var gd = GIFT_DATA[i];
          var effAng = gd.angle + Math.sin(angle * 0.5) * 0.22;
          var gx = Math.sin(effAng) * gd.dist * 0.65;
          var gz = Math.cos(effAng) * gd.dist * 0.55 + 2.5;
          var gy = -9.6;
          var p = project(gx, gy, gz, 0);
          projectedGifts.push({ p: p, data: gd, index: i });
        }

        projectedGifts.sort(function (a, b) { return a.p.z - b.p.z; });

        ctx.globalCompositeOperation = 'source-over';
        for (var j = 0; j < projectedGifts.length; j++) {
          var item = projectedGifts[j];
          var p = item.p;
          var gd = item.data;
          var bw = p.scale * 2.15;
          var bh = bw * 0.86;
          var lidH = bh * 0.24;
          var x = p.x - bw / 2;
          var y = p.y - bh / 2;

          giftHitBoxes.push({ x: x - 6, y: y - 18, w: bw + 12, h: bh + 34, cx: p.x, cy: p.y, data: gd });

          ctx.save();
          ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.beginPath();
          ctx.ellipse(p.x, y + bh + 3, bw * 0.56, bh * 0.14, 0, 0, TAU);
          ctx.fill();

          var bodyGrad = ctx.createLinearGradient(x, y, x + bw, y + bh);
          bodyGrad.addColorStop(0, gd.lidColor);
          bodyGrad.addColorStop(1, gd.boxColor);
          ctx.fillStyle = bodyGrad;
          ctx.fillRect(x + bw * 0.04, y + lidH, bw * 0.92, bh - lidH);

          ctx.fillStyle = 'rgba(0,0,0,0.22)';
          ctx.fillRect(x + bw * 0.04, y + lidH, bw * 0.92, 4);

          ctx.fillStyle = gd.lidColor;
          ctx.fillRect(x, y, bw, lidH);

          var ribW = bw * 0.15;
          ctx.fillStyle = gd.ribbon;
          ctx.fillRect(p.x - ribW / 2, y, ribW, bh);
          ctx.fillRect(x + bw * 0.04, y + lidH + (bh - lidH) * 0.42, bw * 0.92, ribW * 0.85);

          ctx.strokeStyle = gd.ribbon;
          ctx.lineWidth = Math.max(1.8, bw * 0.045);
          ctx.beginPath();
          ctx.ellipse(p.x - bw * 0.1, y - lidH * 0.15, bw * 0.11, lidH * 0.36, -0.35, 0, TAU);
          ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(p.x + bw * 0.1, y - lidH * 0.15, bw * 0.11, lidH * 0.36, 0.35, 0, TAU);
          ctx.stroke();

          ctx.fillStyle = 'rgba(235, 200, 218, 0.55)';
          ctx.font = Math.max(10, Math.round(bw * 0.18)) + 'px "Georgia", serif';
          ctx.textAlign = 'center';
          ctx.fillText(gd.id, p.x, y + bh + Math.max(14, bw * 0.26));
          ctx.restore();
        }
      }

      function drawSnowflakes(dt) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = '#f5d5e6';
        ctx.lineCap = 'round';

        for (var i = 0; i < snowFlakes.length; i++) {
          var f = snowFlakes[i];
          f.y += f.speed * dt * 45;
          f.x += Math.sin(f.drift + f.y * 0.012) * 0.35;
          f.rot += f.rotSpd;
          if (f.y > H + 20) { f.y = -20; f.x = rand(W); }

          ctx.save();
          ctx.translate(f.x, f.y);
          ctx.rotate(f.rot);
          ctx.globalAlpha = f.alpha;
          ctx.lineWidth = Math.max(0.8, f.r * 0.1);

          for (var b = 0; b < 6; b++) {
            ctx.rotate(Math.PI / 3);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -f.r);
            ctx.moveTo(0, -f.r * 0.55);
            ctx.lineTo(-f.r * 0.28, -f.r * 0.78);
            ctx.moveTo(0, -f.r * 0.55);
            ctx.lineTo(f.r * 0.28, -f.r * 0.78);
            ctx.stroke();
          }
          ctx.restore();
        }
        ctx.restore();
      }

      // 弹窗控制
      var modal = document.getElementById('modal');
      var mNum = document.getElementById('m-num');
      var mTitle = document.getElementById('m-title');
      var mDesc = document.getElementById('m-desc');
      document.getElementById('m-close').addEventListener('click', function () {
        modal.classList.remove('show');
      });
      modal.addEventListener('click', function (e) {
        if (e.target === modal) modal.classList.remove('show');
      });

      function openGiftModal(box) {
        spawnBurstParticles(box.cx, box.cy, 36);
        mNum.textContent = 'WISH BOX ' + box.data.id;
        mTitle.textContent = box.data.title;
        mDesc.textContent = box.data.desc;
        modal.classList.add('show');
      }

      // 指针交互
      function onPointerDown(x, y) {
        isDragging = true;
        dragMoved = false;
        lastX = x;
      }

      function onPointerMove(x, y) {
        if (!isDragging) return;
        var dx = x - lastX;
        if (Math.abs(dx) > 2) dragMoved = true;
        userAngle += dx * 0.0065;
        lastX = x;
        spawnPointerTrail(x, y);
      }

      function onPointerUp(x, y) {
        isDragging = false;
        if (dragMoved) return;

        // 1. 点击顶部星星：触发星光爆发 + 三连发盛大烟花
        var distStar = Math.hypot(x - starScreenPos.x, y - starScreenPos.y);
        if (distStar <= starScreenPos.r) {
          starBurst = 1.0;
          spawnBurstParticles(starScreenPos.x, starScreenPos.y, 40);
          launchFirework(W * 0.25, H * 0.22, 1.15);
          launchFirework(W * 0.5, H * 0.15, 1.25);
          launchFirework(W * 0.75, H * 0.22, 1.15);
          return;
        }

        // 2. 点击礼物盒
        for (var i = giftHitBoxes.length - 1; i >= 0; i--) {
          var box = giftHitBoxes[i];
          if (x >= box.x && x <= box.x + box.w && y >= box.y && y <= box.y + box.h) {
            openGiftModal(box);
            return;
          }
        }

        // 3. 点击空白夜空区域：在点击位置放一朵定制烟花
        if (y < H * 0.65) {
          launchFirework(x, y, rand(1.15, 0.85));
        }
      }

      canvas.addEventListener('mousedown', function (e) { onPointerDown(e.clientX, e.clientY); });
      window.addEventListener('mousemove', function (e) { onPointerMove(e.clientX, e.clientY); });
      window.addEventListener('mouseup', function (e) { if (isDragging) onPointerUp(e.clientX, e.clientY); });

      canvas.addEventListener('touchstart', function (e) {
        if (e.touches.length > 0) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      window.addEventListener('touchmove', function (e) {
        if (e.touches.length > 0) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      window.addEventListener('touchend', function (e) {
        if (isDragging && e.changedTouches.length > 0) {
          onPointerUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }
      });

      // 主循环
      var lastTime = 0;
      function render(now) {
        var time = now * 0.001;
        var dt = lastTime ? Math.min(0.05, time - lastTime) : 0.016;
        lastTime = time;

        if (!isDragging) {
          userAngle += autoSpeed * dt;
        }
        if (starBurst > 0) {
          starBurst = Math.max(0, starBurst - dt * 1.8);
        }

        drawBackground(time, dt);
        updateAndDrawFireworks(time, dt); // 烟花置于背景之上、圣诞树之后，营造纵深感
        drawGroundGlow();
        drawTreeAndOrnaments(time, userAngle);
        drawMagicSpirits(dt, userAngle);
        drawTopStar(time, userAngle);
        drawGifts(userAngle);
        drawSnowflakes(dt);

        requestAnimationFrame(render);
      }

      glowSprites.push(makeGlowSprite([255, 225, 240]));
      glowSprites.push(makeGlowSprite([255, 150, 200]));
      glowSprites.push(makeGlowSprite([235, 110, 175]));
      buildOrnamentSprites();

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(render);
    })();
</script>
</body>
